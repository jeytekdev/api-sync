name: api-sync

on:
  push:
    branches: [master]
  pull_request:

jobs:
  unit:
    name: "Unit tests (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer update --no-interaction --prefer-dist

      - run: vendor/bin/phpunit -c phpunit.xml.dist

  check:
    name: "Collections up to date"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --no-progress --prefer-dist

      - name: Verify Postman/Insomnia/Bruno collections are up to date
        run: bin/api-sync check --config=api-sync.php
